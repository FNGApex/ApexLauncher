[package]
name = "modloader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4"] }
chrono = { version = "0.4", features = ["clock"], default-features = false }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros", "rt"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
async-trait = "0.1"
thiserror = "1"
# CF manual-download auto-recovery: watch an open instance's mods/ dir for dropped
# jars. Exact pins (MSRV 1.85; project on 1.96). See docs/design/cf-manual-download-ux.md.
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
specta = { version = "=2.0.0-rc.25", features = ["serde_json", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tempfile = "3"

